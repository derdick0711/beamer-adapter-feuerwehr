<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beamer Adapter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Beamer Adapter</h1>
    <div id="status-bar">
      <a href="/admin" class="badge" style="text-decoration:none">⚙ Admin</a>
      <span id="status-power" class="badge">–</span>
      <span id="status-input" class="badge">–</span>
      <span id="status-blank" class="badge hidden">Schwarz</span>
      <span id="status-reach" class="badge badge-warn hidden">Offline</span>
    </div>
  </header>

  <main>
    <!-- Szenen-Automatisierung -->
    <section class="card">
      <h2>Szenen</h2>
      <div class="btn-row">
        <button class="btn btn-primary"  onclick="startScene()">Präsentation starten</button>
        <button class="btn btn-danger"   onclick="stopScene()">Präsentation beenden</button>
      </div>
    </section>

    <!-- Deckenlicht -->
    <section class="card">
      <h2>Licht <span id="light-badge" class="status-dot"></span></h2>
      <div class="btn-row">
        <button class="btn" id="btn-light-on"  onclick="setLight('on')">Licht ein</button>
        <button class="btn" id="btn-light-off" onclick="setLight('off')">Licht aus</button>
      </div>
    </section>

    <!-- Leinwand -->
    <section class="card">
      <h2>Leinwand <span id="screen-pos" class="muted-label"></span></h2>
      <div class="btn-row">
        <button class="btn" onclick="setScreen('close')">Runter</button>
        <button class="btn" onclick="setScreen('stop')">Stop</button>
        <button class="btn" onclick="setScreen('open')">Hoch</button>
      </div>
    </section>

    <!-- Beamer-Steuerung -->
    <section class="card">
      <h2>Beamer</h2>

      <p class="group-label">Strom</p>
      <div class="btn-row">
        <button id="btn-on"  class="btn btn-primary" onclick="power('on')">Einschalten</button>
        <button id="btn-off" class="btn btn-danger"  onclick="power('off')">Ausschalten</button>
      </div>

      <hr class="card-divider">

      <p class="group-label">Eingang</p>
      <div class="btn-row">
        <button class="btn" onclick="setInput('hdmi')">HDMI</button>
        <button class="btn" onclick="setInput('vga')">VGA</button>
      </div>

      <hr class="card-divider">

      <p class="group-label">Bild</p>
      <div class="btn-row">
        <button class="btn" onclick="blank(true)">Schwarz schalten</button>
        <button class="btn btn-primary" onclick="blank(false)">Bild freigeben</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
